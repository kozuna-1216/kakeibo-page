<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルな家計簿</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>家計簿</h1>
  </header>

  <main>
    <section aria-labelledby="entry-heading">
      <h2 id="entry-heading">収支を登録</h2>
      <form id="expense-form">
        <p>
          <label for="date">日付</label>
          <input type="date" id="date" name="date" required>
        </p>

        <p>
          <label for="item">品目</label>
          <input type="text" id="item" name="item" placeholder="例：食費" required>
        </p>

        <p>
          <label for="type">区分</label>
          <select id="type" name="type" required>
            <option value="expense">支出</option>
            <option value="income">収入</option>
          </select>
        </p>

        <p>
          <label for="amount">金額</label>
          <input type="number" id="amount" name="amount" min="0" step="1" placeholder="例：1000" required>
          <span>円</span>
        </p>

        <button type="submit">追加</button>
      </form>
    </section>

    <section aria-labelledby="summary-heading">
      <h2 id="summary-heading">合計金額</h2>
      <p id="total-amount">0円</p>
    </section>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">登録一覧</h2>
      <table>
        <thead>
          <tr>
            <th scope="col">日付</th>
            <th scope="col">品目</th>
            <th scope="col">区分</th>
            <th scope="col">金額</th>
          </tr>
        </thead>
        <tbody id="expense-list">
          <tr id="empty-message">
            <td colspan="4">登録されたデータはありません。</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
